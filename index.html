<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Rehmat Enterprises Invoice</title><link rel='stylesheet' href='style.css'></head><body><main><section class='panel no-print'><h1>Rehmat Enterprises — GST Invoice Generator</h1><div class='grid'><label>Invoice No.<input id='inv' value='RE-001'></label><label>Date<input id='date' type='date'></label><label>Buyer Name<input id='buyer'></label><label>Buyer GSTIN (optional)<input id='bgst'></label><label class='wide'>Buyer Address<textarea id='baddr'></textarea></label><label>Place of Supply / State<input id='pos' placeholder='Punjab'></label><label>Tax Type<select id='taxType'><option value='intra'>CGST + SGST</option><option value='inter'>IGST</option></select></label></div><h2>Items</h2><div id='items'></div><button onclick='addItem()'>+ Add item</button><button onclick='renderInvoice()'>Update Invoice</button><button class='primary' onclick='window.print()'>Download / Print PDF</button></section><section id='invoice' class='invoice'></section></main><script src='app.js'></script></body></html>
